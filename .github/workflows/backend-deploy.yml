name: Deploy Backend to AWS Lambda

on:
  push:
    branches:
      - production

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: citi-workshop-backend
  LAMBDA_FUNCTION: citi-workshop-backend

jobs:
  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::392038041040:role/citi-workshop-github-actions-role
          role-session-name: GitHubActionsBackendDeployment

      - name: Verify AWS identity
        run: |
          echo "AWS identity:"
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: backend
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Update Lambda
        run: |
          aws lambda update-function-code \
            --function-name "${{ env.LAMBDA_FUNCTION }}" \
            --image-uri "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Wait for Lambda deployment
        run: |
          aws lambda wait function-updated \
            --function-name "${{ env.LAMBDA_FUNCTION }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Verify Lambda
        run: |
          aws lambda get-function \
            --function-name "${{ env.LAMBDA_FUNCTION }}" \
            --region "${{ env.AWS_REGION }}"

          echo "========================================"
          echo "Backend deployment successful!"
          echo "========================================"
          echo "Function: ${{ env.LAMBDA_FUNCTION }}"
          echo "Image tag: ${{ github.sha }}"
          echo "Region: ${{ env.AWS_REGION }}"
          echo "========================================"
